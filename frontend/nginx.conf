server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve real files/assets as-is; anything else falls back to index.html
    # so React Router (HashRouter or BrowserRouter) can handle the route
    # client-side instead of Nginx 404ing on unknown paths like /login.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets (they change name on every build, so
    # this is safe); never cache index.html itself so deploys take effect
    # immediately instead of being stuck behind a stale cached shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
